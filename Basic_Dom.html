<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Implemetation</title>
    <link rel="stylesheet" href="Basic_Dom.css">
</head>
<body>
    <div class="main">
        <div class="interface">
            <h2>Welcome To JavaScript</h2>
            <input id="ipt" placeholder="Enter New Heading">
            <div id="inner">
                <button id="btn1">Change Heading</button>
                <button id="btn2">Change Background Color</button>
                <button id="btn3">Increase Font</button>
            </div>
            <div id="inner2">
                <button id="btn4">Hide/Show</button>
                <button id="btn5">Rest</button>
            </div>
            <p style="margin-bottom: 40px;">This Text will disappear on clicking Hide</p>
        </div>
        
    </div>


    <script src="Basic_Dom.js"></script>
</body>
</html>
